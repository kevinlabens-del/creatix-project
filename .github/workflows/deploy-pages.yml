name: Deploy ZIP to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site from ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="CR3-TIX-MAP-v1.16.5-Splash-Stable-Ready-to-Post.zip"
          test -f "$ZIP_FILE"
          rm -rf _site
          mkdir -p _site
          unzip -q "$ZIP_FILE" -d _site
          if [ ! -f _site/index.html ]; then
            FIRST_DIR="$(find _site -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/index.html" ]; then
              shopt -s dotglob
              mv "$FIRST_DIR"/* _site/
              rmdir "$FIRST_DIR"
            fi
          fi
          test -f _site/index.html
          touch _site/.nojekyll

      - name: Snapshot extracted source for layout audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source-audit
          mkdir -p .source-audit
          cp _site/index.html .source-audit/index.html
          find _site -maxdepth 2 -type f \( -name '*.js' -o -name '*.css' \) -print0 | while IFS= read -r -d '' file; do
            rel="${file#_site/}"
            mkdir -p ".source-audit/$(dirname "$rel")"
            cp "$file" ".source-audit/$rel"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .source-audit
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot CR3@TIX source for layout audit"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
