name: Deploy ZIP to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site from ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="CR3-TIX-MAP-v1.16.5-Splash-Stable-Ready-to-Post.zip"
          test -f "$ZIP_FILE"
          rm -rf _site
          mkdir -p _site
          unzip -q "$ZIP_FILE" -d _site
          if [ ! -f _site/index.html ]; then
            FIRST_DIR="$(find _site -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/index.html" ]; then
              shopt -s dotglob
              mv "$FIRST_DIR"/* _site/
              rmdir "$FIRST_DIR"
            fi
          fi
          test -f _site/index.html

          # v1.16.6: automatic layout overlay. The original add/edit/delete
          # workflow remains untouched inside app.js.
          cp auto-layout.js _site/auto-layout.js
          python3 - <<'PY'
          from pathlib import Path

          index = Path('_site/index.html')
          html = index.read_text(encoding='utf-8')
          marker = '<script src="auto-layout.js"></script>'
          if marker not in html:
              target = '<script src="app.js"></script>'
              if target not in html:
                  raise SystemExit('app.js script tag not found')
              html = html.replace(target, target + marker, 1)
          index.write_text(html, encoding='utf-8')

          sw = Path('_site/sw.js')
          if sw.exists():
              text = sw.read_text(encoding='utf-8')
              text = text.replace("const CACHE='cr3atix-map-v1.16.5'", "const CACHE='cr3atix-map-v1.16.6-autolayout'")
              if "'./auto-layout.js'" not in text:
                  text = text.replace("'./app.js','./auto-update.js'", "'./app.js','./auto-layout.js','./auto-update.js'")
              sw.write_text(text, encoding='utf-8')
          PY
          touch _site/.nojekyll

      - name: Remove temporary source audit
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .source-audit ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -r .source-audit
            git commit -m "Remove temporary CR3@TIX source audit"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
