name: Deploy SOUTIEN Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-soutien-worker.yml"
      - "soutien-worker/**"

permissions:
  contents: read

concurrency:
  group: soutien-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soutien-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "true"
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soutien-worker/package-lock.json

      - name: Validate protected credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Verify source before deployment
        run: npm run check

      - name: Provision EU D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          curl --fail-with-body --silent --show-error             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "${API_URL}?name=cr3atix-soutien-db"             --output d1-list.json

          DB_ID="$(node -e "const p=require('./d1-list.json'); if(p.success!==true) process.exit(2); const d=Array.isArray(p.result)?p.result.find(x=>x&&x.name==='cr3atix-soutien-db'):null; if(d?.uuid) process.stdout.write(d.uuid)")"

          if [ -z "${DB_ID}" ]; then
            curl --fail-with-body --silent --show-error               --request POST               --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               --header "Content-Type: application/json"               --data '{"name":"cr3atix-soutien-db","jurisdiction":"eu","read_replication":{"mode":"disabled"}}'               "${API_URL}"               --output d1-create.json
            DB_ID="$(node -e "const p=require('./d1-create.json'); if(p.success!==true||!p.result?.uuid){console.error('Cloudflare did not return a D1 database identifier');process.exit(2)} process.stdout.write(p.result.uuid)")"
          fi

          [[ "${DB_ID}" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Invalid D1 database identifier"; exit 1; }

          DB_ID="${DB_ID}" node -e "const fs=require('fs');const path='wrangler.jsonc';const config=JSON.parse(fs.readFileSync(path,'utf8'));const binding=config.d1_databases?.find(x=>x.binding==='DB');if(!binding)throw new Error('Missing DB binding');binding.database_id=process.env.DB_ID;binding.database_name='cr3atix-soutien-db';fs.writeFileSync(path,JSON.stringify(config,null,2)+'\\n')"

          rm -f d1-list.json d1-create.json
          echo "database_id=${DB_ID}" >> "${GITHUB_OUTPUT}"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cr3atix-soutien-db --remote --config wrangler.jsonc

      - name: Prepare protected deployment secrets
        env:
          CR3ATIX_ADMIN_PASSWORD: ${{ secrets.CR3ATIX_ADMIN_PASSWORD }}
          PAYPAL_BUSINESS_ID: ${{ secrets.PAYPAL_BUSINESS_ID }}
          PAYPAL_RECEIVER_ID: ${{ secrets.PAYPAL_RECEIVER_ID }}
          PAYPAL_RECEIVER_EMAIL: ${{ secrets.PAYPAL_RECEIVER_EMAIL }}
          SOUTIEN_PAYMENT_MODE: ${{ secrets.SOUTIEN_PAYMENT_MODE }}
          ALLOW_LIVE_PAYMENTS: ${{ secrets.ALLOW_LIVE_PAYMENTS }}
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED_PAYMENT_MODE="${SOUTIEN_PAYMENT_MODE:-disabled}"
          case "${REQUESTED_PAYMENT_MODE}" in
            disabled|test|live) ;;
            *) echo "::error::SOUTIEN_PAYMENT_MODE must be disabled, test or live"; exit 1 ;;
          esac

          if [ "${REQUESTED_PAYMENT_MODE}" != "disabled" ]; then
            test -n "${PAYPAL_BUSINESS_ID:-}" || { echo "::error::Missing PAYPAL_BUSINESS_ID"; exit 1; }
            if [ -z "${PAYPAL_RECEIVER_ID:-}" ] && [ -z "${PAYPAL_RECEIVER_EMAIL:-}" ]; then
              echo "::error::PAYPAL_RECEIVER_ID or PAYPAL_RECEIVER_EMAIL is required"
              exit 1
            fi
          fi
          if [ "${REQUESTED_PAYMENT_MODE}" = "live" ] && [ "${ALLOW_LIVE_PAYMENTS:-}" != "yes" ]; then
            echo "::error::Live mode requires ALLOW_LIVE_PAYMENTS=yes"
            exit 1
          fi

          PAYMENT_MODE="${REQUESTED_PAYMENT_MODE}" node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.vars.PAYMENT_MODE = process.env.PAYMENT_MODE;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE
          echo "DEPLOY_PAYMENT_MODE=${REQUESTED_PAYMENT_MODE}" >> "${GITHUB_ENV}"

          RATE_LIMIT_SALT="$(openssl rand -hex 32)"
          SESSION_SECRET="$(openssl rand -hex 32)"
          ADMIN_PASSWORD_PEPPER=""
          ADMIN_PASSWORD_HASH=""

          if [ -n "${CR3ATIX_ADMIN_PASSWORD:-}" ]; then
            ADMIN_PASSWORD_PEPPER="$(openssl rand -hex 32)"
            ADMIN_PASSWORD_HASH="$(ADMIN_PASSWORD_PEPPER="${ADMIN_PASSWORD_PEPPER}" node scripts/hash-admin-password.mjs)"
            [[ "${ADMIN_PASSWORD_HASH}" == hmac_sha256\$* ]] || { echo "::error::Invalid administrator password verifier"; exit 1; }
          else
            echo "Administrator password is not configured; public API remains available and admin login stays locked."
          fi

          RATE_LIMIT_SALT="${RATE_LIMIT_SALT}" \
          SESSION_SECRET="${SESSION_SECRET}" \
          ADMIN_PASSWORD_PEPPER="${ADMIN_PASSWORD_PEPPER}" \
          ADMIN_PASSWORD_HASH="${ADMIN_PASSWORD_HASH}" \
          PAYPAL_BUSINESS_ID="${PAYPAL_BUSINESS_ID:-}" \
          PAYPAL_RECEIVER_ID="${PAYPAL_RECEIVER_ID:-}" \
          PAYPAL_RECEIVER_EMAIL="${PAYPAL_RECEIVER_EMAIL:-}" \
          ALLOW_LIVE_PAYMENTS="${ALLOW_LIVE_PAYMENTS:-}" \
          node <<'NODE'
          const fs = require('fs');
          const secrets = {
            RATE_LIMIT_SALT: process.env.RATE_LIMIT_SALT,
            SESSION_SECRET: process.env.SESSION_SECRET
          };
          if (process.env.ADMIN_PASSWORD_HASH && process.env.ADMIN_PASSWORD_PEPPER) {
            secrets.ADMIN_PASSWORD_HASH = process.env.ADMIN_PASSWORD_HASH;
            secrets.ADMIN_PASSWORD_PEPPER = process.env.ADMIN_PASSWORD_PEPPER;
          }
          for (const name of ['PAYPAL_BUSINESS_ID', 'PAYPAL_RECEIVER_ID', 'PAYPAL_RECEIVER_EMAIL', 'ALLOW_LIVE_PAYMENTS']) {
            if (process.env[name]) secrets[name] = process.env[name];
          }
          fs.writeFileSync('deploy-secrets.json', JSON.stringify(secrets));
          NODE

          unset RATE_LIMIT_SALT SESSION_SECRET ADMIN_PASSWORD_PEPPER ADMIN_PASSWORD_HASH CR3ATIX_ADMIN_PASSWORD PAYPAL_BUSINESS_ID PAYPAL_RECEIVER_ID PAYPAL_RECEIVER_EMAIL ALLOW_LIVE_PAYMENTS
      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy-secrets.json || { echo "::error::Missing protected deployment secrets file"; exit 1; }
          trap 'rm -f deploy-secrets.json' EXIT
          npx wrangler deploy --minify --config wrangler.jsonc --secrets-file deploy-secrets.json 2>&1 | tee deploy.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -n 1 || true)"
          test -n "${WORKER_URL}" || { echo "::error::Unable to determine Worker URL"; exit 1; }
          echo "worker_url=${WORKER_URL}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test API
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          CR3ATIX_ADMIN_PASSWORD: ${{ secrets.CR3ATIX_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${WORKER_URL}/v1/health" --output health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${WORKER_URL}/v1/projects" --output projects.json
          WORKER_URL="${WORKER_URL}" DEPLOY_PAYMENT_MODE="${DEPLOY_PAYMENT_MODE}" node <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          const registry = JSON.parse(fs.readFileSync('projects.json', 'utf8'));
          const expectedMode = process.env.DEPLOY_PAYMENT_MODE;
          const expectedEnabled = expectedMode !== 'disabled';
          if (health.ok !== true || health.payment_provider !== 'paypal' || health.payments_enabled !== expectedEnabled || health.payment_mode !== expectedMode) {
            throw new Error('The Worker payment mode does not match the protected deployment configuration');
          }
          if (!Array.isArray(registry.projects) || registry.projects.length === 0) {
            throw new Error('MAP registry is unavailable through the Worker');
          }
          console.log('Health check passed; MAP projects:', registry.projects.length);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## CR3@TIX SOUTIEN Worker\n\n' +
            '- URL: ' + process.env.WORKER_URL + '\n' +
            '- Payment provider: **PayPal**\n' +
            '- Payment mode: **' + expectedMode + '**\n' +
            '- Payments enabled: **' + expectedEnabled + '**\n' +
            '- MAP projects returned: **' + registry.projects.length + '**\n');
          NODE

          if [ -n "${CR3ATIX_ADMIN_PASSWORD:-}" ]; then
            node -e "const fs=require('fs');fs.writeFileSync('admin-login.json',JSON.stringify({password:process.env.CR3ATIX_ADMIN_PASSWORD}))"
            curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
              --request POST \
              --header "Origin: https://kevinlabens-del.github.io" \
              --header "Content-Type: application/json" \
              --data-binary @admin-login.json \
              "${WORKER_URL}/v1/admin/login" \
              --output admin-session.json
            ADMIN_TOKEN="$(node -e "const p=require('./admin-session.json');if(typeof p.token!=='string'||p.token.length<32)process.exit(2);process.stdout.write(p.token)")"
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${ADMIN_TOKEN}" \
              "${WORKER_URL}/v1/admin/dashboard?period=30" \
              --output admin-dashboard.json
            DEPLOY_PAYMENT_MODE="${DEPLOY_PAYMENT_MODE}" node -e "const p=require('./admin-dashboard.json');if(p.payment_mode!==process.env.DEPLOY_PAYMENT_MODE||!p.summary||!Array.isArray(p.by_project)||!p.funnel)throw new Error('Administrator dashboard smoke test failed')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Origin: https://kevinlabens-del.github.io" \
              --header "Authorization: Bearer ${ADMIN_TOKEN}" \
              "${WORKER_URL}/v1/admin/logout" \
              --output admin-logout.json
            node -e "const p=require('./admin-logout.json');if(p.ok!==true)throw new Error('Administrator logout smoke test failed')"
            echo "- Administrator login/dashboard/logout: **passed**" >> "${GITHUB_STEP_SUMMARY}"
            rm -f admin-login.json admin-session.json admin-dashboard.json admin-logout.json
            unset ADMIN_TOKEN CR3ATIX_ADMIN_PASSWORD
          fi

          rm -f health.json projects.json deploy.log
