name: Temporary source audit

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[source-audit]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract application source for security integration audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cr3atix-audit
          mkdir -p /tmp/cr3atix-audit
          unzip -q CR3-TIX-MAP-v1.16.5-Splash-Stable-Ready-to-Post.zip -d /tmp/cr3atix-audit
          APP="$(find /tmp/cr3atix-audit -type f -name app.js | head -n 1)"
          test -n "$APP"
          cp "$APP" app-source-audit.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-source-audit.js
          if ! git diff --cached --quiet; then
            git commit -m "[source-audit] Extract app source for security integration"
            git push
          fi
