<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05050d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CR3@TIX Project Map</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="cosmic-background.css"></head><body><div id="appSplash" class="app-splash" role="status" aria-label="Chargement de CR3@TIX Map">
<div class="app-splash-loader" aria-hidden="true"><div id="appSplashFill" class="app-splash-fill"></div><div id="appSplashSpark" class="app-splash-spark"></div></div>
</div>
<header class="topbar"><div class="brand"><span class="brand-dot"></span><strong>CR3@TIX</strong><span>PROJECT MAP</span></div><div class="top-actions"><button id="fitBtn" class="icon-btn" title="Centrer">⌖</button><button id="searchBtn" class="icon-btn" title="Rechercher">⌕</button><button id="installBtn" class="install-btn" hidden>Installer</button></div></header>
<main id="viewport" class="viewport"><canvas id="cosmicCanvas" class="cosmic-canvas" aria-hidden="true"></canvas><div id="world" class="world"><svg id="links" class="links" aria-hidden="true"></svg><div id="nodes"></div><div id="plusLayer"></div></div></main>
<div class="zoom-controls"><button id="zoomIn" aria-label="Zoom avant">+</button><button id="zoomOut" aria-label="Zoom arrière">−</button></div><div class="hint">Glisser pour naviguer • Pincer / molette pour zoomer • Touchez un projet pour l’ouvrir</div>
<dialog id="nodeDialog" class="modal"><form method="dialog" class="modal-card" id="nodeForm"><h2 id="dialogTitle">Projet</h2><input id="editId" type="hidden"><input id="editParent" type="hidden"><label>Nom<input id="editTitle" maxlength="50" required></label><label>Type<input id="editType" maxlength="24"></label><label>Description<textarea id="editDesc" maxlength="130"></textarea></label><label>Statut<select id="editStatus"><option value="online">🟢 En ligne</option><option value="development">🟠 En développement</option><option value="test">🔵 Test</option><option value="offline">🔴 Hors ligne</option><option value="archived">⚫ Archivé</option></select></label><label>Progression (%)<input id="editProgress" type="number" min="0" max="100"></label><label>URL du projet final<input id="editUrl" type="url"></label><label>Icône / image de la vignette<input id="editIcon"></label><div class="dialog-actions"><button id="deleteBtn" type="button" class="danger">Supprimer</button><button value="cancel">Annuler</button><button id="saveBtn" value="default" class="primary">Enregistrer</button></div></form></dialog>
<div id="searchBox" class="search-box" hidden><input id="searchInput" type="search" placeholder="Rechercher un projet…" autocomplete="off"><button id="closeSearch">×</button></div><div id="toast" class="toast" hidden></div>
<script src="splash-screen.js"></script><script src="auto-update.js"></script><script src="energy-transfer.js"></script><script src="app.js"></script></body></html>
